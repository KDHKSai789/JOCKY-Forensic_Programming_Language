[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jocky"
version = "1.3.0"
description = "JOCKY Forensic Framework - A cross-platform forensic DSL compiler and analysis toolchain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "JOCKY Authors" }
]
keywords = ["forensics", "linux", "windows", "security", "analysis", "cli", "DSL"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0"
]

[project.scripts]
jocky = "jocky_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["compiler*", "runtime*", "forensics*", "analysis*", "evidence*"]

[tool.setuptools.package-dir]
"" = "."
